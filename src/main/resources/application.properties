# Change username/password to match your MySQL install
spring.datasource.url=jdbc:mysql://localhost:3306/netbackup?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Sruthisk@346
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8080
server.error.include-message=always
spring.servlet.multipart.max-file-size=2MB

# ---- JWT (override in production with the NETBACKUP_JWT_SECRET environment variable, 32+ characters) ----
netbackup.jwt.secret=${NETBACKUP_JWT_SECRET:change-me-dev-only-secret-key-0123456789-abcdef}
netbackup.jwt.expiration-minutes=480

# ---- Scheduled backups (Spring cron: sec min hour day month weekday) ----
netbackup.schedule.enabled=true
# default: every day at 02:00. For a quick demo use: 0 * * * * *   (every minute)
netbackup.schedule.cron=0 0 2 * * *
